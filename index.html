<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DigitalBurj — Learn. Build. Transform.</title>
  <meta name="description" content="DigitalBurj Academy, Studio and Business AI — one ecosystem to learn, build and transform.">
  <meta property="og:title" content="DigitalBurj — Learn. Build. Transform.">
  <meta property="og:description" content="DigitalBurj Academy, Studio and Business AI — one ecosystem to learn, build and transform.">
  <meta property="og:image" content="brand/05_WEB_SOCIAL/OpenGraph_1200x630.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="brand/05_WEB_SOCIAL/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/05_WEB_SOCIAL/favicon-app-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="brand/05_WEB_SOCIAL/favicon-app-16.png">
  <link rel="apple-touch-icon" href="brand/05_WEB_SOCIAL/apple-touch-icon.png">
  <link rel="manifest" href="brand/05_WEB_SOCIAL/site.webmanifest">
  <meta name="theme-color" content="#FFFFFF">
  <style>
    :root { --ink: #111a17; --accent: #f0401e; --muted: #5b6360; --line: #e4e6e5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    img { max-width: 100%; height: auto; display: block; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    header { padding: 48px 0 32px; }
    header picture img { margin: 0 auto; }
    h2 { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 20px; font-weight: 600; }
    section { padding: 32px 0; border-top: 1px solid var(--line); }
    .divisions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .division { display: flex; flex-direction: column; gap: 14px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .ecosystem { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; }
    .ecosystem img { margin: 0 auto; }
    footer { padding: 32px 0 48px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    footer a { color: var(--accent); }
    @media (max-width: 900px) {
      .divisions { grid-template-columns: 1fr; }
      .ecosystem { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <picture>
        <source srcset="brand/02_LOGO_LOCKUPS/DigitalBurj_Primary_Logo_Tagline.webp" type="image/webp">
        <img src="brand/02_LOGO_LOCKUPS/DigitalBurj_Primary_Logo_Tagline.png" width="1637" height="385" alt="DigitalBurj — Learn. Build. Transform.">
      </picture>
    </header>

    <section aria-labelledby="div-h">
      <h2 id="div-h">Divisions</h2>
      <div class="divisions">
        <div class="division">
          <picture>
            <source srcset="brand/03_DIVISIONS/DigitalBurj_Academy_Lockup.webp" type="image/webp">
            <img src="brand/03_DIVISIONS/DigitalBurj_Academy_Lockup.png" width="539" height="216" alt="DigitalBurj Academy — Learn it. Apply it. Prove it.">
          </picture>
          <ul class="sr-only"><li>Skills</li><li>Programs</li><li>Certifications</li><li>Global Careers</li></ul>
        </div>
        <div class="division">
          <picture>
            <source srcset="brand/03_DIVISIONS/DigitalBurj_Studio_Lockup.webp" type="image/webp">
            <img src="brand/03_DIVISIONS/DigitalBurj_Studio_Lockup.png" width="513" height="216" alt="DigitalBurj Studio — Build what deserves to exist.">
          </picture>
          <ul class="sr-only"><li>Discovery</li><li>Product Design</li><li>Engineering</li><li>Deployment</li></ul>
        </div>
        <div class="division">
          <picture>
            <source srcset="brand/03_DIVISIONS/DigitalBurj_BusinessAI_Lockup.webp" type="image/webp">
            <img src="brand/03_DIVISIONS/DigitalBurj_BusinessAI_Lockup.png" width="518" height="216" alt="DigitalBurj Business AI — Fix the process. Then automate it.">
          </picture>
          <ul class="sr-only"><li>Diagnose</li><li>Redesign</li><li>Automate</li><li>Measure Impact</li></ul>
        </div>
      </div>
    </section>

    <section aria-labelledby="eco-h">
      <h2 id="eco-h">Ecosystem</h2>
      <div class="ecosystem">
        <img src="brand/04_ECOSYSTEM/DigitalBurj_VerifiedTalent.webp" width="164" height="148" alt="Verified Talent — Capability you can see. Evidence you can trust.">
        <img src="brand/04_ECOSYSTEM/DigitalBurj_Jobs.webp" width="190" height="148" alt="Jobs — More than applications. Better hiring decisions.">
        <img src="brand/04_ECOSYSTEM/DigitalBurj_Identity.webp" width="201" height="148" alt="Identity — Secure access for individuals and organisations.">
        <img src="brand/04_ECOSYSTEM/DigitalBurj_UnifiedWorkspace.webp" width="210" height="148" alt="Unified Workspace — One account. One ecosystem. All your tools.">
        <img src="brand/04_ECOSYSTEM/DigitalBurj_API_Integrations.webp" width="200" height="148" alt="API &amp; Integrations — Build. Connect. Scale.">
        <img src="brand/04_ECOSYSTEM/DigitalBurj_Documentation.webp" width="195" height="148" alt="Documentation — Clear. Complete. Developer ready.">
        <img src="brand/04_ECOSYSTEM/DigitalBurj_Support.webp" width="190" height="148" alt="Support — Real help. Real progress.">
        <img src="brand/04_ECOSYSTEM/DigitalBurj_Status.webp" width="180" height="148" alt="Status — Transparent. Reliable. Always on.">
        <img src="brand/04_ECOSYSTEM/DigitalBurj_Admin.webp" width="185" height="148" alt="Admin — Secure. Governed. Built for scale.">
      </div>
    </section>

    <footer>
      <span>© DigitalBurj</span>
      <a href="brand/06_PRINT/DigitalBurj_EXACT_Master.pdf">Brand master (PDF)</a>
    </footer>
  </div>
</body>
</html>
